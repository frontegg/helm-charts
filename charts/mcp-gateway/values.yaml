# Default values for mcp-gateway
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Where both images are pulled from:
#   dockerhub - Frontegg's Docker Hub, docker.io/fronteggcustomers (default). Needs the pull secret below.
#   aws       - Frontegg's Amazon ECR. EKS nodes pull with their IAM role, so no pull secret,
#               once Frontegg has granted your AWS account access.
#   anything else is used as-is as your own mirror (registry and namespace), e.g.
#   registry.example.com/frontegg -> registry.example.com/frontegg/hybrid-agen-co-{auth,gw}
imageRegistry: dockerhub

# MCP Auth container/deployment configuration
mcpAuth:
  # Full image path without tag. Overrides imageRegistry for this image; leave empty normally.
  repository: ""
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    failureThreshold: 10
    periodSeconds: 10

# MCP Gateway container/deployment configuration
mcpGw:
  # Full image path without tag. Overrides imageRegistry for this image; leave empty normally.
  repository: ""
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  # Local tool search loads an embedding model (~90Mi) and the app's search index on top of the base footprint.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    failureThreshold: 10
    periodSeconds: 10

# The default registry is a private Docker Hub organization. Create a pull secret with the
# credential Frontegg provided and reference it here (not needed for ECR on EKS):
#   kubectl create secret docker-registry frontegg-registry \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username=fronteggcustomers \
#     --docker-password='<token from Frontegg>'
# imagePullSecrets:
#   - name: frontegg-registry
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - NET_RAW
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP

autoscaling:
  mcpAuth:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  mcpGw:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

env:
  redisHost: ""
  redisPort: "6379"
  redisPassword: ""
  redisDb: "0"
  redisTlsEnabled: "true"
  cacheTtl: "300"
  fronteggRegion: "eu"
  vendorClientId: ""
  vendorClientSecret: ""
  applicationId: ""
  # Your Frontegg cloud MCP gateway host, without scheme, e.g. <id>.mcp-gw.frontegg.com.
  fronteggMcpGwHost: ""
  # Public URL clients use to reach this gateway, with scheme, e.g. https://mcp.example.com.
  hybridAuthHost: ""
  # secretEncryptionKey: ""
  # approvalFlowWebhookEndpoint: ""
  # eventStdoutEnabled: "true"
  # eventWebhookProvider: ""
  # eventWebhookUrl: ""
  # eventWebhookSecret: ""
  # hybridCacheMaxStalenessSeconds: "86400"
  # Deprecated: read only when fronteggMcpGwHost is unset. The authorization server is https://<fronteggMcpGwHost>.
  # externalAuthorizationUrl: ""
  # toolSearchMode: "cloud"

existingSecret: ""
