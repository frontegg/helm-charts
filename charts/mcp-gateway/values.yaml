# Default values for mcp-gateway
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# MCP Auth container/deployment configuration
mcpAuth:
  repository: 527305576865.dkr.ecr.us-east-1.amazonaws.com/docker-hub/frontegg/hybrid-agen-co-auth
  tag: 65e17bc
  pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    failureThreshold: 10
    periodSeconds: 10

# MCP Gateway container/deployment configuration
mcpGw:
  repository: 527305576865.dkr.ecr.us-east-1.amazonaws.com/docker-hub/frontegg/hybrid-agen-co-gw
  tag: 65e17bc
  pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    failureThreshold: 10
    periodSeconds: 10

# Routes the OAuth and discovery endpoints to mcp-auth and everything else to mcp-gw.
# Disabled by default: hybrid installs front the services with their own ingress.
ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecretName: ""
  # MCP sessions are long-lived streams; nginx defaults sever them at 60s and buffer responses.
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  # Context can also arrive as a path prefix (/ctx/<b64>/authorize); prefix rules cannot see past
  # it, so this regex sends the prefix form of the auth endpoints to mcp-auth as well.
  ctxAuthRegex: '/ctx/[^/]+/(authorize|token|dcr/register|\.well-known|integration-callback|security-stepup-verify|external-mcp)'
  authPaths:
    - /authorize
    - /token
    - /dcr/register
    - /.well-known/oauth-protected-resource
    - /.well-known/oauth-authorization-server
    - /integration-callback
    - /security-stepup-verify
    - /external-mcp

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - NET_RAW
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
