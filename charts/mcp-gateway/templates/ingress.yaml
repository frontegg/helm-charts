{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled is true" .Values.ingress.host }}
{{- $authPaths := list }}
{{- range .Values.ingress.authPaths }}
{{- $authPaths = append $authPaths (regexQuoteMeta (trimPrefix "/" .)) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fullname" . }}
  labels:
    {{- include "commonLabels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled is true" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ printf "/(ctx/[^/]+/)?(%s)" (join "|" $authPaths) | squote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "fullname" . }}-auth
                port:
                  number: {{ .Values.mcpAuth.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fullname" . }}-gw
                port:
                  number: {{ .Values.mcpGw.port }}
{{- end }}
