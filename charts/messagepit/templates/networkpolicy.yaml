{{- if .Values.networkPolicy.enabled }}
{{- $ingressFrom := .Values.networkPolicy.ingressFrom }}
{{- if eq (len $ingressFrom) 0 }}
{{- fail "networkPolicy.ingressFrom must not be empty when networkPolicy.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "messagepit.fullname" . }}
  labels:
    {{- include "messagepit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "messagepit.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml $ingressFrom | nindent 8 }}
      ports:
        - port: ui
          protocol: TCP
        - port: sendgrid
          protocol: TCP
        {{- range .Values.service.extraPorts }}
        - port: {{ default .port .targetPort }}
          protocol: {{ default "TCP" .protocol }}
        {{- end }}
{{- end }}
